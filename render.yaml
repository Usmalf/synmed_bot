services:
  - type: web
    name: synmed-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt -r web/backend/requirements.txt
    startCommand: uvicorn web.backend.app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: synmed-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/synmed.db
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SYNMED_STORAGE_ROOT
        value: /var/data/storage
      - key: SYNMED_BACKUP_ROOT
        value: /var/data/backups
      - key: AUTH_DEV_OTP_VISIBLE
        value: "0"
      - key: PAYSTACK_CURRENCY
        value: NGN
      - key: FRONTEND_BASE_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: AUTH_VERIFY_BASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: Synmed2_bot
      - key: ADMIN_IDS
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "0"
      - key: SMTP_USE_SSL
        value: "1"

  - type: web
    name: synmed-web
    runtime: static
    buildCommand: cd web/frontend && npm ci && npm run build
    staticPublishPath: web/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  - type: worker
    name: synmed-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt -r web/backend/requirements.txt
    startCommand: python bot.py
    disk:
      name: synmed-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/synmed.db
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SYNMED_STORAGE_ROOT
        value: /var/data/storage
      - key: SYNMED_BACKUP_ROOT
        value: /var/data/backups
      - key: AUTH_DEV_OTP_VISIBLE
        value: "0"
      - key: PAYSTACK_CURRENCY
        value: NGN
      - key: FRONTEND_BASE_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: AUTH_VERIFY_BASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: Synmed2_bot
      - key: ADMIN_IDS
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "0"
      - key: SMTP_USE_SSL
        value: "1"
